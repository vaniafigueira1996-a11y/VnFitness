<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182235" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="50%" stop-color="#FF7300" />
      <stop offset="100%" stop-color="#E05600" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255, 115, 0, 0.3)" stroke-width="6" />

  <!-- Lightning Bolt Glow -->
  <path d="M 280 64 L 144 288 L 264 288 L 232 448 L 368 224 L 248 224 Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)" />

  <!-- Lightning Bolt Main Sharp -->
  <path d="M 280 64 L 144 288 L 264 288 L 232 448 L 368 224 L 248 224 Z" 
        fill="url(#boltGrad)" />
</svg>
