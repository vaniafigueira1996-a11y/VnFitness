<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VnFitness — Login & Cadastro</title>

  <!-- PWA Meta Tags & Manifest -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FF7300">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VnFitness">
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="auth-viewport">
    <div class="auth-bg-art"></div>

    <!-- Frame do Mobile Phone simulando a imagem 2 de referência -->
    <div class="auth-phone-frame">
      
      <!-- Fundo com a foto da mulher atleta (padrão) ou personalizada -->
      <div class="auth-photo-background-wrap">
        <img id="login-bg-img" src="img/login_bg.jpg" alt="VnFitness Background" class="auth-bg-photo">
        <div class="auth-photo-gradient-overlay"></div>
      </div>

      <!-- Topo com Identificação da Marca VnFitness -->
      <div class="auth-top-brand">
        <div class="auth-brand-pill">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          <span>VnFitness</span>
        </div>
      </div>

      <!-- Controle flutuante discreto para adicionar/trocar foto de fundo -->
      <div class="auth-photo-controls">
        <label for="bg-file-input" class="btn-photo-action" title="Adicionar ou trocar foto de fundo">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          <span>Trocar foto</span>
        </label>
        <input type="file" id="bg-file-input" accept="image/*" style="display: none;">
        
        <button type="button" id="btn-reset-bg" class="btn-photo-action btn-reset-photo" title="Restaurar foto padrão da atleta" style="display: none;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          <span>Padrão</span>
        </button>
      </div>

      <!-- Card Inferior Flutuante com Glassmorphism Translúcido -->
      <div class="auth-glass-card">
        
        <!-- Abas de Alternância Superior: ENTRAR / CRIAR CONTA -->
        <div class="auth-mode-tabs">
          <button type="button" class="auth-tab-btn active" id="tab-btn-login">ENTRAR</button>
          <button type="button" class="auth-tab-btn" id="tab-btn-signup">CRIAR CONTA</button>
        </div>

        <h2 class="auth-title" id="auth-title">Bem-vindo de volta!</h2>

        <div id="auth-alert" class="auth-alert"></div>

        <form id="auth-form">
          <!-- Campo Nome (visível apenas no modo Cadastro) -->
          <div class="auth-input-group" id="name-group" style="display: none;">
            <span class="auth-icon-left" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input type="text" id="name-input" class="auth-input" placeholder="Seu Nome Completo">
          </div>

          <!-- Campo E-mail -->
          <div class="auth-input-group">
            <span class="auth-icon-left" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input type="email" id="email-input" class="auth-input" placeholder="Seu E-mail" required autocomplete="email">
          </div>

          <!-- Campo Senha -->
          <div class="auth-input-group">
            <span class="auth-icon-left" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="password-input" class="auth-input" placeholder="Sua Senha" required autocomplete="current-password">
            <span class="auth-icon-right" id="toggle-password" title="Mostrar senha" aria-label="Mostrar ou ocultar senha">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </span>
          </div>

          <!-- Botão de Ação Principal -->
          <button type="submit" id="submit-btn" class="btn btn-auth-action">ENTRAR NO VNFITNESS</button>

          <!-- Alternar Modo Inferior -->
          <p class="auth-toggle-text">
            <span id="toggle-question">Não tem uma conta ainda?</span>
            <span class="auth-toggle-link" id="toggle-auth-mode">Cadastre-se aqui</span>
          </p>
        </form>

      </div>
    </div>
  </div>

  <script src="js/pwa-install.js" defer></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
